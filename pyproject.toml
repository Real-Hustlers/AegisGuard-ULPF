[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "aegisguard-ulpf"
version = "0.1.0"
description = "Universal Log Pre-processing Framework"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "cryptography>=42.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aegisguard_ulpf.parsing.semantic_packs" = [
    "packs/*.json",
    "trusted_keys/*.pem"
]